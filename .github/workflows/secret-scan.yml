name: Secret scan

on:
  pull_request:
  push:
    branches: [main, codex/legalteam-distribution]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.8
        with:
          extra_args: --results=verified,unknown
