name: CI

on:
  pull_request:
  push:
    branches: [main, codex/legalteam-distribution, codex/workflow-prototype-20261009]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:files
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Synthetic scope SQL contracts
        run: |
          node scripts/workflow/prepare-dashboard-scope.mjs
          node scripts/workflow/test-read-scope.mjs
      - run: pnpm test:worker-runtime
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Workflow integration with isolated services
        run: pnpm exec playwright test --config playwright.workflow.config.ts
      - name: Existing E2E with external services blocked
        run: node scripts/workflow/regression.mjs
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key-not-a-secret
          VITE_APP_ENV: isolated-production
          VITE_WORKFLOW_NAVIGATION: five-areas
      - name: Production PWA with external services blocked
        run: node scripts/workflow/regression.mjs
        env:
          WORKFLOW_REGRESSION_PRODUCTION: '1'

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  responsive-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - name: iPhone workflows with isolated services in WebKit
        run: pnpm exec playwright test --config playwright.responsive.config.ts
        env:
          WORKFLOW_RESPONSIVE_BROWSER: webkit
      - name: Synthetic responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-webkit
          path: output/responsive-qa-20261010/
          retention-days: 7
